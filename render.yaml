# A starting point for hosting on Render (https://render.com). Review the plan names and regions before using it.
# Deploying this asks you nothing: the secrets are generated by Render and nothing secret lives in this file.
services:
  - type: web
    name: icsi-store
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    # Uploaded pictures live on a persistent disk (or switch to S3-compatible storage: see README).
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icsi-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      # The one-time code for creating the first Owner at /admin/setup. Render makes it for you: open this service on
      # Render, choose Environment, and click the eye next to ADMIN_SETUP_TOKEN to read it. The setup page closes
      # itself once the Owner exists, so the code can stay.
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      # Nothing else is needed to start. The site's address comes from Render automatically (set APP_URL only if you add
      # your own domain). Email, card payments, Google sign-in and the AI assistant are optional: add their keys later
      # under Environment (see the README), then switch them on in Admin > Settings.

databases:
  - name: icsi-db
    plan: basic-256mb
    databaseName: icsi_store
    user: icsi
